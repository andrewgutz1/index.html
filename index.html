<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>CRUD Spreadsheet App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
      color: #1f2937;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 14px;
    }

    .buttons {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 7px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #6b7280;
      color: white;
    }

    .edit {
      background: #f59e0b;
      color: white;
      padding: 7px 10px;
    }

    .delete {
      background: #dc2626;
      color: white;
      padding: 7px 10px;
    }

    .search {
      margin-bottom: 15px;
    }

    .search input {
      width: 100%;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #f9fafb;
    }

    .actions {
      display: flex;
      gap: 5px;
    }

    .message {
      display: none;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 7px;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .active {
      color: #166534;
      font-weight: bold;
    }

    .inactive {
      color: #991b1b;
      font-weight: bold;
    }

    .pending {
      color: #92400e;
      font-weight: bold;
    }

    @media(max-width: 800px) {
      body {
        padding: 15px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>CRUD Spreadsheet App</h1>

  <p class="subtitle">
    Manage records stored in Google Sheets.
  </p>

  <div id="message" class="message"></div>


  <!-- FORM -->

  <div class="card">

    <h2 id="formTitle">Add Record</h2>

    <form id="recordForm">

      <input type="hidden" id="recordId">

      <div class="form-grid">

        <div>
          <label>Name</label>

          <input
            type="text"
            id="name"
            placeholder="Enter name"
            required
          >
        </div>


        <div>
          <label>Email</label>

          <input
            type="email"
            id="email"
            placeholder="Enter email"
            required
          >
        </div>


        <div>
          <label>Status</label>

          <select id="status" required>

            <option value="">
              Select status
            </option>

            <option value="Active">
              Active
            </option>

            <option value="Inactive">
              Inactive
            </option>

            <option value="Pending">
              Pending
            </option>

          </select>
        </div>

      </div>


      <div class="buttons">

        <button
          type="submit"
          class="primary"
          id="saveButton"
        >
          Add Record
        </button>

        <button
          type="button"
          class="secondary"
          id="cancelButton"
          onclick="resetForm()"
          style="display:none"
        >
          Cancel
        </button>

      </div>

    </form>

  </div>


  <!-- TABLE -->

  <div class="card">

    <h2>Records</h2>

    <div class="search">

      <input
        type="text"
        id="search"
        placeholder="Search records..."
        onkeyup="filterRecords()"
      >

    </div>


    <div class="table-container">

      <table>

        <thead>

          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Status</th>
            <th>Created</th>
            <th>Updated</th>
            <th>Actions</th>
          </tr>

        </thead>

        <tbody id="recordsTable"></tbody>

      </table>

    </div>

  </div>

</div>


<script>

/*

==================================================
GOOGLE APPS SCRIPT WEB APP URL
==================================================

Replace the value below with your deployed
Google Apps Script Web App URL.

Example:

https://script.google.com/macros/s/XXXXXXXXXXXX/exec
*/

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbxTUk4UxhOkPprBDqn8F7SOHmFenve78Uzu8J2zkzNCYLSkhtb0KIw-A2sSMEUv6vISPQ/exec";


let records = [];
let editing = false;


/*
==================================================
API REQUEST
==================================================
*/

async function api(action, data = {}) {

  const url =
    WEB_APP_URL +
    "?action=" +
    encodeURIComponent(action);


  const response = await fetch(url, {

    method: "POST",

    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },

    body: JSON.stringify(data)

  });


  if (!response.ok) {

    throw new Error(
      "Server request failed."
    );

  }


  return await response.json();

}


/*
==================================================
LOAD RECORDS
==================================================
*/

async function loadRecords() {

  try {

    const result =
      await api("read");

    if (!result.success) {

      throw new Error(
        result.message
      );

    }

    records =
      result.data || [];

    renderRecords(records);

  }

  catch(error) {

    showMessage(
      error.message,
      "error"
    );

  }

}


/*
==================================================
RENDER RECORDS
==================================================
*/

function renderRecords(data) {

  const table =
    document.getElementById(
      "recordsTable"
    );

  table.innerHTML = "";


  if (data.length === 0) {

    table.innerHTML = `
      <tr>
        <td colspan="6"
            style="text-align:center;padding:30px">
          No records found.
        </td>
      </tr>
    `;

    return;
  }


  data.forEach(function(record) {

    const row =
      document.createElement("tr");


    row.innerHTML = `

      <td>
        ${escapeHtml(record.name)}
      </td>

      <td>
        ${escapeHtml(record.email)}
      </td>

      <td class="${String(record.status).toLowerCase()}">
        ${escapeHtml(record.status)}
      </td>

      <td>
        ${escapeHtml(record.createdAt)}
      </td>

      <td>
        ${escapeHtml(record.updatedAt)}
      </td>

      <td>

        <div class="actions">

          <button
            class="edit"
            onclick="editRecord('${escapeJs(record.id)}')"
          >
            Edit
          </button>

          <button
            class="delete"
            onclick="deleteRecord('${escapeJs(record.id)}')"
          >
            Delete
          </button>

        </div>

      </td>

    `;


    table.appendChild(row);

  });

}


/*
==================================================
CREATE / UPDATE
==================================================
*/

document
  .getElementById("recordForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const data = {

        id:
          document.getElementById(
            "recordId"
          ).value,

        name:
          document.getElementById(
            "name"
          ).value.trim(),

        email:
          document.getElementById(
            "email"
          ).value.trim(),

        status:
          document.getElementById(
            "status"
          ).value

      };


      try {

        let result;


        if (editing) {

          result =
            await api(
              "update",
              data
            );

        } else {

          result =
            await api(
              "create",
              data
            );

        }


        if (!result.success) {

          throw new Error(
            result.message
          );

        }


        showMessage(
          result.message,
          "success"
        );


        resetForm();

        loadRecords();

      }

      catch(error) {

        showMessage(
          error.message,
          "error"
        );

      }

    }
  );


/*
==================================================
EDIT
==================================================
*/

function editRecord(id) {

  const record =
    records.find(
      item =>
        String(item.id) === String(id)
    );


  if (!record) {

    showMessage(
      "Record not found.",
      "error"
    );

    return;

  }


  editing = true;


  document.getElementById(
    "recordId"
  ).value = record.id;


  document.getElementById(
    "name"
  ).value = record.name;


  document.getElementById(
    "email"
  ).value = record.email;


  document.getElementById(
    "status"
  ).value = record.status;


  document.getElementById(
    "formTitle"
  ).textContent =
    "Edit Record";


  document.getElementById(
    "saveButton"
  ).textContent =
    "Update Record";


  document.getElementById(
    "cancelButton"
  ).style.display =
    "inline-block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/*
==================================================
DELETE
==================================================
*/

async function deleteRecord(id) {

  const record =
    records.find(
      item =>
        String(item.id) === String(id)
    );


  if (!record) {

    showMessage(
      "Record not found.",
      "error"
    );

    return;

  }


  if (!confirm(
    "Delete " +
    record.name +
    "?"
  )) {

    return;

  }


  try {

    const result =
      await api(
        "delete",
        {
          id: id
        }
      );


    if (!result.success) {

      throw new Error(
        result.message
      );

    }


    showMessage(
      result.message,
      "success"
    );


    loadRecords();

  }

  catch(error) {

    showMessage(
      error.message,
      "error"
    );

  }

}


/*
==================================================
RESET FORM
==================================================
*/

function resetForm() {

  editing = false;


  document
    .getElementById("recordForm")
    .reset();


  document.getElementById(
    "recordId"
  ).value = "";


  document.getElementById(
    "formTitle"
  ).textContent =
    "Add Record";


  document.getElementById(
    "saveButton"
  ).textContent =
    "Add Record";


  document.getElementById(
    "cancelButton"
  ).style.display =
    "none";

}


/*
==================================================
SEARCH
==================================================
*/

function filterRecords() {

  const search =
    document.getElementById(
      "search"
    ).value
    .toLowerCase()
    .trim();


  if (!search) {

    renderRecords(records);

    return;

  }


  const filtered =
    records.filter(
      function(record) {

        return (

          String(record.name)
            .toLowerCase()
            .includes(search)

          ||

          String(record.email)
            .toLowerCase()
            .includes(search)

          ||

          String(record.status)
            .toLowerCase()
            .includes(search)

        );

      }
    );


  renderRecords(filtered);

}


/*
==================================================
MESSAGE
==================================================
*/

function showMessage(
  message,
  type
) {

  const element =
    document.getElementById(
      "message"
    );


  element.textContent =
    message;


  element.className =
    "message " + type;


  setTimeout(
    function() {

      element.className =
        "message";

    },
    4000
  );

}


/*
==================================================
ESCAPE HTML
==================================================
*/

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/*
==================================================
ESCAPE JAVASCRIPT
==================================================
*/

function escapeJs(value) {

  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");

}


/*
==================================================
START APPLICATION
==================================================
*/

loadRecords();

</script>

</body>
</html>
